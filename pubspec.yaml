name: gestor_contrasenas_mysql
description: "Gestor de contraseñas con MySQL y Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  encrypt: ^5.0.3
  crypto: ^3.0.6
  pointycastle: ^3.9.1
  uuid: ^4.5.1
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.0
  local_auth: ^3.0.2
  image_picker: ^1.2.0
  http: ^1.4.0
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env